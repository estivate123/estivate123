<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>龟龟，我来救你了</title>
    <style>
        /* 背景色回归天蓝色 */
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Arial', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        #ui-container { position: absolute; top: 10px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 10; }
        
        #score-container { color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); margin-bottom: 5px; transition: transform 0.2s; }
        #score { font-size: 42px; font-weight: 900; color: #FFD700; text-shadow: 0 0 5px #d35400, 2px 2px 5px rgba(0,0,0,0.5); font-family: 'Verdana', sans-serif;}
        
        #progress-wrapper { width: 70%; max-width: 350px; height: 12px; background: rgba(0,0,0,0.4); border-radius: 10px; padding: 2px; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.4); }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #4facfe, #00f2fe); border-radius: 8px; transition: width 0.5s ease-out; box-shadow: 0 0 8px rgba(0, 242, 254, 0.6); }
        #sub-text { font-size: 12px; margin-top: 5px; color: rgba(255,255,255,0.9); font-weight: bold; letter-spacing: 1px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);}

        #tutorial-hint { position: absolute; bottom: 25%; width: 100%; text-align: center; color: rgba(255,255,255,0.95); font-size: 15px; pointer-events: none; text-shadow: 1px 1px 3px rgba(0,0,0,0.6); font-weight: bold; transition: opacity 1s ease; opacity: 1;}
        .fade-out { opacity: 0 !important; }

        .float-text { position: absolute; color: #FFD700; font-weight: bold; font-size: 40px; text-shadow: 2px 2px 0 #000; pointer-events: none; animation: floatUp 0.8s forwards; z-index: 20; left: 50%; top: 40%; transform: translate(-50%, -50%); }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            50% { transform: translate(-50%, -150%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -200%) scale(1); }
        }
        
        .modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.85); color: white; padding: 30px; border-radius: 20px; text-align: center; z-index: 100; min-width: 280px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from {transform: translate(-50%, -50%) scale(0.5); opacity: 0;} to {transform: translate(-50%, -50%) scale(1); opacity: 1;} }
        
        #game-over h1 { margin: 0 0 15px 0; color: #ff6b6b; font-size: 28px; }
        #game-win h1 { margin: 0 0 15px 0; color: #FFD700; font-size: 32px; text-shadow: 0 0 15px orange; }
        
        button { padding: 12px 30px; font-size: 20px; cursor: pointer; background: linear-gradient(to bottom, #4CAF50, #2E7D32); border: none; color: white; border-radius: 50px; pointer-events: all; font-weight: bold; box-shadow: 0 5px 0 #1B5E20; margin-top: 20px; outline: none; -webkit-tap-highlight-color: transparent;}
        button:active { transform: translateY(4px); box-shadow: 0 1px 0 #1B5E20; }
        button.restart-btn { background: linear-gradient(to bottom, #2196F3, #1565C0); box-shadow: 0 5px 0 #0D47A1; } 

        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 20px; font-weight: bold; text-shadow: 1px 1px 2px black;}
    </style>
</head>
<body>

<div id="loading">正在准备...</div>

<div id="ui-container">
    <div id="score-container"><span id="score">0</span></div>
    <div id="progress-wrapper"><div id="progress-bar"></div></div>
    <div id="sub-text">清理进度</div>
</div>

<div id="tutorial-hint">↔ 旋转 | 🔍 滚轮/双指缩放 | 👆 点击拔除</div>

<div id="game-over" class="modal">
    <h1>槽位已满</h1>
    <p>海龟还要背着它们过冬吗?</p>
    <p style="color:#ddd; font-size:14px;">最终进度: <span id="final-percent-lose">0%</span></p>
    <button onclick="location.reload()">重试</button>
</div>

<div id="game-win" class="modal">
    <h1>清理完毕!</h1>
    <p>海龟感觉轻了十斤!</p>
    <p style="font-size: 32px; color: #FFD700; font-weight: bold; margin-top:10px;">Score: <span id="final-score-win">0</span></p>
    <button class="restart-btn" onclick="location.reload()">再来一局</button>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
    window.onload = function() {
        if (typeof THREE === 'undefined') {
            alert("加载失败，请刷新网页");
        } else {
            document.getElementById('loading').style.display = 'none';
            init();
            animate();
        }
    };

    const TRAY_SLOTS = 7; 
    const BARNACLE_TYPES = [
        { color: 0xFF4500, name: 'red' },    
        { color: 0xFFD700, name: 'yellow' }, 
        { color: 0x32CD32, name: 'green' },  
        { color: 0x1E90FF, name: 'blue' },   
        { color: 0xFF69B4, name: 'pink' }    
    ];
    const TOTAL_BARNACLES = 90; 

    let scene, camera, renderer;
    let mainGroup; 
    let raycaster, mouse;
    
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let dragVelocity = { x: 0, y: 0 }; 
    let hasMoved = false;

    let currentZoomDist = 55; 
    let targetZoomDist = 55;
    const MIN_ZOOM = 25; 
    const MAX_ZOOM = 90; 
    let initialPinchDist = 0; 

    let score = 0;
    let clearedSetsCount = 0;
    let remainingBarnacles = TOTAL_BARNACLES; 
    let isGameOver = false;
    let hasCleanedOnce = false; 

    let tray = []; 
    let fallingObjects = []; 
    let traySlotsMeshes = []; 
    let trayGroup; 

    const materialCache = {};

    function getMaterial(colorHex) {
        if (!materialCache[colorHex]) {
            materialCache[colorHex] = new THREE.MeshPhongMaterial({ 
                color: colorHex,
                flatShading: true,
                shininess: 50 
            });
        }
        return materialCache[colorHex];
    }

    function init() {
        scene = new THREE.Scene();
        // 背景色：天空蓝
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 40, 140);

        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, currentZoomDist); 
        camera.lookAt(0, 0, 0);

        scene.add(camera);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; 
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);
        
        const bottomLight = new THREE.DirectionalLight(0x8899aa, 0.4);
        bottomLight.position.set(0, -20, 10);
        scene.add(bottomLight);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();
        
        window.addEventListener('resize', onWindowResize, false);
        
        document.addEventListener('mousedown', onMouseDown, false);
        document.addEventListener('mousemove', onMouseMove, false);
        document.addEventListener('mouseup', onMouseUp, false);
        document.addEventListener('wheel', onMouseWheel, {passive: false}); 
        
        document.addEventListener('touchstart', onTouchStart, {passive: false});
        document.addEventListener('touchmove', onTouchMove, {passive: false});
        document.addEventListener('touchend', onTouchEnd, false);

        createGameWorld();
        createTrayVisuals(); 
        
        onWindowResize(); 
    }

    function createMainTurtle() {
        mainGroup = new THREE.Group();
        
        // 深色海龟，配合亮色背景
        const shellColor = 0x2F353B; 
        const skinColor = 0x4E423E;  
        const bellyColor = 0x8D8680; 

        const shellGeo = new THREE.SphereGeometry(9, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.55);
        shellGeo.applyMatrix4(new THREE.Matrix4().makeScale(1, 0.7, 1));
        const shellMat = new THREE.MeshPhongMaterial({ color: shellColor, flatShading: true, shininess: 20 });
        const shell = new THREE.Mesh(shellGeo, shellMat);
        shell.castShadow = true;
        shell.receiveShadow = true;
        shell.userData.isBarnaclePart = false;
        mainGroup.add(shell);

        const bellyGeo = new THREE.CircleGeometry(9, 32);
        bellyGeo.rotateX(Math.PI / 2); 
        const bellyMat = new THREE.MeshPhongMaterial({ color: bellyColor });
        const belly = new THREE.Mesh(bellyGeo, bellyMat);
        belly.position.y = 0.1; 
        belly.userData.isBarnaclePart = false;
        mainGroup.add(belly);

        const headGeo = new THREE.SphereGeometry(2.5, 16, 16);
        const headMat = new THREE.MeshPhongMaterial({ color: skinColor });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.set(0, 1, 10); 
        head.scale.set(1, 1, 1.2); 
        head.userData.isBarnaclePart = false;
        mainGroup.add(head);
        
        const eyeGeo = new THREE.SphereGeometry(0.3, 8, 8);
        const eyeMat = new THREE.MeshBasicMaterial({color: 0x111111});
        const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
        eyeL.position.set(1.2, 1.5, 11);
        const eyeR = eyeL.clone();
        eyeR.position.set(-1.2, 1.5, 11);
        mainGroup.add(eyeL);
        mainGroup.add(eyeR);

        const limbGeo = new THREE.CapsuleGeometry(1.2, 3, 4, 8);
        const createLimb = (x, z, rotY) => {
            const limb = new THREE.Mesh(limbGeo, headMat);
            limb.position.set(x, 0, z);
            limb.rotation.x = Math.PI / 2;
            limb.rotation.z = rotY;
            limb.userData.isBarnaclePart = false;
            mainGroup.add(limb);
        };
        createLimb(7, 6, -Math.PI/4);  
        createLimb(-7, 6, Math.PI/4);  
        createLimb(7, -6, Math.PI/4);  
        createLimb(-7, -6, -Math.PI/4);

        const tailGeo = new THREE.ConeGeometry(0.8, 3, 8);
        const tail = new THREE.Mesh(tailGeo, headMat);
        tail.position.set(0, 0.5, -9.5);
        tail.rotation.x = -Math.PI / 2.5;
        tail.userData.isBarnaclePart = false;
        mainGroup.add(tail);

        scene.add(mainGroup);
    }

    function createBarnacleGroup(typeData) {
        const group = new THREE.Group();
        group.userData.isBarnacle = true; 
        group.userData.typeName = typeData.name;
        
        const count = Math.floor(Math.random() * 3) + 3; 
        for(let i=0; i<count; i++) {
             const topR = 0.15 + Math.random() * 0.15;
             const botR = 0.3 + Math.random() * 0.2;
             const height = 0.5 + Math.random() * 0.4;
             
             const geo = new THREE.CylinderGeometry(topR, botR, height, 6);
             geo.translate(0, height/2, 0); 

             const mesh = new THREE.Mesh(geo, getMaterial(typeData.color));
             const angle = Math.random() * Math.PI * 2;
             const dist = Math.random() * 0.3;
             mesh.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
             mesh.rotation.x = (Math.random()-0.5) * 0.6;
             mesh.rotation.z = (Math.random()-0.5) * 0.6;

             mesh.castShadow = true;
             mesh.receiveShadow = true;
             mesh.userData.isBarnaclePart = true;
             
             group.add(mesh);
        }
        const scale = 0.8 + Math.random() * 0.4;
        group.scale.set(scale, scale, scale);
        return group;
    }

    function createGameWorld() {
        createMainTurtle();

        const obstacles = [
            { x: 0, y: 1, z: 10, r: 4.8 },   
            { x: 0, y: 0.5, z: -9.5, r: 3.8 }, 
            { x: 7, y: 0, z: 6, r: 4.2 },    
            { x: -7, y: 0, z: 6, r: 4.2 },   
            { x: 7, y: 0, z: -6, r: 4.2 },   
            { x: -7, y: 0, z: -6, r: 4.2 }   
        ];

        let spawnedCount = 0;
        let attempts = 0;

        while (spawnedCount < TOTAL_BARNACLES && attempts < 3000) {
            attempts++;
            const theta = Math.random() * Math.PI * 2; 
            const phi = Math.random() * (Math.PI * 0.5); 
            
            const r = 8.8; 
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = (r * 0.7) * Math.cos(phi); 
            const z = r * Math.sin(phi) * Math.sin(theta);

            let collision = false;
            for (let obs of obstacles) {
                const dx = x - obs.x;
                const dy = y - obs.y;
                const dz = z - obs.z;
                if (dx*dx + dy*dy + dz*dz < obs.r * obs.r) {
                    collision = true;
                    break;
                }
            }
            if (collision) continue;

            const type = BARNACLE_TYPES[spawnedCount % BARNACLE_TYPES.length];
            const barnacle = createBarnacleGroup(type);

            barnacle.position.set(x, y, z);
            const normal = new THREE.Vector3(x, y / 0.7, z).normalize();
            barnacle.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);

            mainGroup.add(barnacle);
            spawnedCount++;
        }
    }

    function createTrayVisuals() {
        trayGroup = new THREE.Group();

        // 槽位底板
        // 宽度稍微宽一点，确保能容纳缩放后的物品
        const width = TRAY_SLOTS * 3.5 + 1;
        const trayBgGeo = new THREE.BoxGeometry(width, 1.4, 1); 
        const trayBgMat = new THREE.MeshBasicMaterial({ 
            color: 0x000000, 
            transparent: true, 
            opacity: 0.5, // 稍微调淡一点
            depthTest: false, // 永远在最上层
            depthWrite: false
        });
        const trayBg = new THREE.Mesh(trayBgGeo, trayBgMat);
        trayBg.renderOrder = 999;
        trayGroup.add(trayBg);

        // 移除了所有的 LineSegments (白色框线)

        const startX = -(TRAY_SLOTS - 1) * 3.5 / 2;
        const slotGeo = new THREE.BoxGeometry(3, 1, 0.5);
        
        for (let i = 0; i < TRAY_SLOTS; i++) {
            // 不可见的占位符，用于定位
            const slot = new THREE.Mesh(slotGeo, new THREE.MeshBasicMaterial({ visible: false }));
            slot.position.set(startX + i * 3.5, 0, 0.2); 
            trayGroup.add(slot);
            traySlotsMeshes.push(slot); 
        }
        
        camera.add(trayGroup);
        // 位置在 onWindowResize 里会更新
        trayGroup.position.set(0, -10, -20); 
    }

    function onMouseWheel(event) {
        event.preventDefault();
        targetZoomDist += event.deltaY * 0.05;
        targetZoomDist = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, targetZoomDist));
    }

    function onMouseDown(event) {
        isDragging = true;
        hasMoved = false;
        previousMousePosition = { x: event.clientX, y: event.clientY };
        dragVelocity = { x: 0, y: 0 };
    }

    function onMouseMove(event) {
        if (!isDragging) return;
        const deltaX = event.clientX - previousMousePosition.x;
        const deltaY = event.clientY - previousMousePosition.y;
        if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) hasMoved = true;

        if (mainGroup) {
            const rotateSpeed = 0.005;
            mainGroup.rotation.y += deltaX * rotateSpeed;
            mainGroup.rotation.x += deltaY * rotateSpeed;
            mainGroup.rotation.x = Math.max(-0.5, Math.min(0.8, mainGroup.rotation.x));
            dragVelocity = { x: deltaX, y: deltaY }; 
        }
        previousMousePosition = { x: event.clientX, y: event.clientY };
    }

    function onMouseUp(event) {
        isDragging = false;
        if (!hasMoved) handleRaycast(event.clientX, event.clientY);
    }

    function onTouchStart(event) {
        event.preventDefault(); 
        if(event.touches.length === 1) {
            isDragging = true;
            hasMoved = false;
            previousMousePosition = { x: event.touches[0].clientX, y: event.touches[0].clientY };
            dragVelocity = { x: 0, y: 0 };
        } 
        else if (event.touches.length === 2) {
            isDragging = false; 
            const dx = event.touches[0].clientX - event.touches[1].clientX;
            const dy = event.touches[0].clientY - event.touches[1].clientY;
            initialPinchDist = Math.hypot(dx, dy);
        }
    }

    function onTouchMove(event) {
        event.preventDefault();
        if(event.touches.length === 1 && isDragging) {
            const touch = event.touches[0];
            const deltaX = touch.clientX - previousMousePosition.x;
            const deltaY = touch.clientY - previousMousePosition.y;
            if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) hasMoved = true;

            if (mainGroup) {
                const rotateSpeed = 0.005;
                mainGroup.rotation.y += deltaX * rotateSpeed;
                mainGroup.rotation.x += deltaY * rotateSpeed;
                mainGroup.rotation.x = Math.max(-0.5, Math.min(0.8, mainGroup.rotation.x));
                dragVelocity = { x: deltaX, y: deltaY }; 
            }
            previousMousePosition = { x: touch.clientX, y: touch.clientY };
        }
        else if (event.touches.length === 2) {
            const dx = event.touches[0].clientX - event.touches[1].clientX;
            const dy = event.touches[0].clientY - event.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            
            const scaleFactor = initialPinchDist / dist;
            const zoomChange = (initialPinchDist - dist) * 0.1;
            targetZoomDist += zoomChange;
            targetZoomDist = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, targetZoomDist));
            
            initialPinchDist = dist; 
        }
    }

    function onTouchEnd(event) {
        isDragging = false;
        if (!hasMoved && event.changedTouches.length > 0 && event.touches.length === 0) {
            const touch = event.changedTouches[0];
            handleRaycast(touch.clientX, touch.clientY);
        }
    }

    function handleRaycast(clientX, clientY) {
        if (isGameOver) return;

        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(mainGroup.children, true);

        if (intersects.length > 0) {
            const hitObj = intersects[0].object;

            if (hitObj.userData.isBarnaclePart) {
                let barnacleGroup = hitObj.parent;
                while(barnacleGroup && !barnacleGroup.userData.isBarnacle) {
                    barnacleGroup = barnacleGroup.parent;
                }
                
                if (barnacleGroup && barnacleGroup.parent === mainGroup) {
                    detachAndFall(barnacleGroup);
                }
            }
        }
    }

    function detachAndFall(barnacleGroup) {
        if (tray.length + fallingObjects.length >= TRAY_SLOTS) {
            if(navigator.vibrate) navigator.vibrate(50);
            return;
        }

        const worldPos = new THREE.Vector3();
        barnacleGroup.getWorldPosition(worldPos);
        const worldQuat = new THREE.Quaternion();
        barnacleGroup.getWorldQuaternion(worldQuat);

        mainGroup.remove(barnacleGroup);
        scene.add(barnacleGroup);
        barnacleGroup.position.copy(worldPos);
        barnacleGroup.quaternion.copy(worldQuat);

        const typeName = barnacleGroup.userData.typeName;

        let insertIndex = tray.length + fallingObjects.length; 
        
        let lastSameColorIndex = -1;
        for (let i = 0; i < tray.length; i++) {
            if (tray[i].typeName === typeName) {
                lastSameColorIndex = i;
            }
        }
        
        if (lastSameColorIndex !== -1) {
            insertIndex = lastSameColorIndex + 1;
        } else {
             insertIndex = tray.length;
        }

        const fallingObj = {
            mesh: barnacleGroup,
            velocity: new THREE.Vector3(0, 0, 0),
            typeName: typeName,
            isSeated: false,
            finalIndex: insertIndex 
        };
        
        const ejectionForce = worldPos.clone().normalize().multiplyScalar(0.6);
        fallingObj.velocity.add(ejectionForce);
        fallingObj.velocity.y += 0.2; 

        fallingObjects.push(fallingObj);
    }

    function updateFallingObjects() {
        const gravity = new THREE.Vector3(0, -0.35, 0); 
        const arrivalThreshold = 0.8; 

        for (let i = fallingObjects.length - 1; i >= 0; i--) {
            const objData = fallingObjects[i];
            const mesh = objData.mesh;

            if (!objData.isSeated) {
                objData.velocity.add(gravity);
                mesh.position.add(objData.velocity);
                mesh.rotation.x += 0.1;
                
                const targetWorldPos = new THREE.Vector3();
                trayGroup.getWorldPosition(targetWorldPos); 
                targetWorldPos.y += 1.0; 

                const vectorToTarget = targetWorldPos.clone().sub(mesh.position).multiplyScalar(0.05);
                objData.velocity.add(vectorToTarget);

                if (mesh.position.distanceTo(targetWorldPos) < 2.0 || mesh.position.y < targetWorldPos.y) {
                     objData.isSeated = true;
                     objData.velocity.set(0,0,0);
                     insertIntoTray(objData);
                     fallingObjects.splice(i, 1);
                }
            }
        }
    }
    
    function insertIntoTray(objData) {
        const mesh = objData.mesh;
        const typeName = objData.typeName;
        
        let insertIndex = tray.length;
        let lastSameColorIndex = -1;
        
        for (let i = 0; i < tray.length; i++) {
            if (tray[i].typeName === typeName) {
                lastSameColorIndex = i;
            }
        }
        if (lastSameColorIndex !== -1) insertIndex = lastSameColorIndex + 1;

        scene.remove(mesh);
        trayGroup.add(mesh);

        mesh.traverse((child) => {
            if (child.isMesh) {
                child.material = child.material.clone();
                child.material.depthTest = false;
                child.material.depthWrite = false;
                child.renderOrder = 1000; 
            }
        });

        mesh.rotation.set(0.5, 0, 0); 
        mesh.scale.set(0.6, 0.6, 0.6); 

        tray.splice(insertIndex, 0, { typeName: typeName, meshGroup: mesh });
        
        checkMatch();
    }

    function updateTrayPositions() {
        for(let i=0; i<tray.length; i++) {
             const targetPos = traySlotsMeshes[i].position.clone();
             targetPos.z += 0.5; 
             
             const mesh = tray[i].meshGroup;
             mesh.position.lerp(targetPos, 0.2);
        }
    }

    function showFloatingText(text) {
        const div = document.createElement('div');
        div.className = 'float-text';
        div.innerText = text;
        document.body.appendChild(div);
        setTimeout(() => { document.body.removeChild(div); }, 800);
    }

    function checkMatch() {
        if (tray.length < 3) return;

        for (let i = 0; i < tray.length - 2; i++) {
            const t1 = tray[i].typeName;
            const t2 = tray[i+1].typeName;
            const t3 = tray[i+2].typeName;

            if (t1 === t2 && t2 === t3) {
                if (!hasCleanedOnce) {
                    hasCleanedOnce = true;
                    document.getElementById('tutorial-hint').classList.add('fade-out');
                }

                clearedSetsCount++;
                const gain = clearedSetsCount * 10 + 20; 
                score += gain;
                document.getElementById('score').innerText = score;
                showFloatingText("+" + gain);
                
                document.getElementById('score-container').style.transform = "scale(1.3)";
                setTimeout(() => document.getElementById('score-container').style.transform = "scale(1)", 150);

                trayGroup.remove(tray[i].meshGroup);
                trayGroup.remove(tray[i+1].meshGroup);
                trayGroup.remove(tray[i+2].meshGroup);
                
                tray.splice(i, 3);
                
                remainingBarnacles -= 3;
                const cleared = TOTAL_BARNACLES - remainingBarnacles;
                const percent = Math.floor((cleared / TOTAL_BARNACLES) * 100);
                document.getElementById('progress-bar').style.width = percent + '%';

                if (remainingBarnacles <= 0) {
                    gameWin();
                } 
                return; 
            }
        }

        if (tray.length >= TRAY_SLOTS) {
            isGameOver = true;
            document.getElementById('final-percent-lose').innerText = (Math.floor(((TOTAL_BARNACLES - remainingBarnacles) / TOTAL_BARNACLES) * 100)) + '%';
            document.getElementById('game-over').style.display = 'block';
        }
    }

    function gameWin() {
        isGameOver = true;
        document.getElementById('final-score-win').innerText = score;
        document.getElementById('game-win').style.display = 'block';
    }

    // --- 核心修改：手机端缩放适配逻辑 ---
    function onWindowResize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);

        const dist = 20; // 槽位距离相机的深度
        const vFOV = THREE.MathUtils.degToRad(camera.fov); 
        const visibleHeight = 2 * Math.tan(vFOV / 2) * dist;
        const visibleWidth = visibleHeight * camera.aspect;
        
        if (trayGroup) {
            // 默认放在底部
            trayGroup.position.y = -visibleHeight / 2 + 2.5;
            trayGroup.position.z = -dist; 
            
            // 计算槽位的实际宽度 (7个格子 * 3.5间距 + 边距) ≈ 25
            const trayWidth = 26; 

            // 如果屏幕宽度( visibleWidth ) 小于 槽位宽度 (trayWidth)，说明屏幕太窄放不下了
            if (visibleWidth < trayWidth) {
                // 缩小槽位组，留出 5% 的边距
                const scale = (visibleWidth / trayWidth) * 0.95;
                trayGroup.scale.set(scale, scale, scale);
                // 稍微把槽位再抬高一点，因为缩小后视觉重心会变
                trayGroup.position.y += 0.5;
            } else {
                // 电脑宽屏，恢复原状
                trayGroup.scale.set(1, 1, 1);
            }
        }
    }

    function animate() {
        requestAnimationFrame(animate);

        if (Math.abs(camera.position.z - targetZoomDist) > 0.1) {
            camera.position.z += (targetZoomDist - camera.position.z) * 0.1;
        }
        currentZoomDist = camera.position.z;

        if (!isDragging && mainGroup && !isGameOver) {
            dragVelocity.x *= 0.95;
            dragVelocity.y *= 0.95;
            mainGroup.rotation.y += dragVelocity.x * 0.005;
            mainGroup.rotation.x += dragVelocity.y * 0.005;
            mainGroup.position.y = Math.sin(Date.now() * 0.001) * 0.2;
        }

        updateFallingObjects();
        updateTrayPositions(); 
        renderer.render(scene, camera);
    }
</script>
